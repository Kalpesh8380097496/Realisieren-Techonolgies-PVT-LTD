name: Run scraper

on:
  workflow_dispatch:        # Actions tab me "Run workflow" button
  push:
    branches: [ main, master ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt me bekaar packages hain (pip, jupyterlab_pygments...),
      # isliye sirf zaroori packages install kar rahe hain.
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run scraper
        run: |
          mkdir -p output logs
          python main.py 2>&1 | tee logs/execution.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: |
            output/
            logs/
